<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing</title>
  <link rel="stylesheet" href="pricing.css">
</head>
<body>
<h1>Оберіть свій тариф</h1>
<div class="pricing-grid">
  <div class="pricing-card">
    <h3>Базовий</h3>
    <div class="price">₴500<span>/міс</span></div>
    <ul>
      <li>1 користувач</li>
      <li>5 ГБ пам'яті</li>
      <li>Базова підтримка</li>
    </ul>
    <button class="cta-button">Обрати</button>
  </div>

  <div class="pricing-card featured">
    <div class="badge">Популярний</div>
    <h3>Професійний</h3>
    <div class="price">₴1200<span>/міс</span></div>
    <ul>
      <li>5 користувачів</li>
      <li>50 ГБ пам'яті</li>
      <li>Пріоритетна підтримка</li>
    </ul>
    <button class="cta-button">Обрати</button>
  </div>

  <div class="pricing-card">
    <h3>Преміум</h3>
    <div class="price">₴2500<span>/міс</span></div>
    <ul>
      <li>Безліміт користувачів</li>
      <li>1 ТБ пам'яті</li>
      <li>24/7 підтримка</li>
    </ul>
    <button class="cta-button">Обрати</button>
  </div>
</div>

</body>
</html>
